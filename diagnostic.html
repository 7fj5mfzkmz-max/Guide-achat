<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnostic des liens — Guide d’achat</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#555;--card:#f4f4f6;--accent:#0b57d0;--ok:#1b7f3b;--ko:#b3261e;--warn:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#eee;--muted:#aaa;--card:#1e1e22;--accent:#8ab4f8;--ok:#6dd58c;--ko:#f2b8b5;--warn:#e6c35c}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:1rem;max-width:60rem;margin-inline:auto}
h1{font-size:1.3rem}textarea{width:100%;height:9rem;box-sizing:border-box;font:13px/1.4 ui-monospace,monospace}
button{font:inherit;padding:.7rem 1rem;border-radius:10px;border:0;background:var(--accent);color:#fff;min-height:44px}
button[disabled]{opacity:.5}
.sum{background:var(--card);border-radius:12px;padding:.8rem 1rem;margin:1rem 0;font-weight:600}
.row{background:var(--card);border-radius:12px;padding:.7rem .9rem;margin:.5rem 0}
.row b{display:block;word-break:break-all}.muted{color:var(--muted);font-size:13px}
.ok{color:var(--ok)}.ko{color:var(--ko)}.warn{color:var(--warn)}
</style>
</head>
<body>
<h1>Diagnostic des liens</h1>
<p class="muted">Collez jusqu’à 20 liens produit (un par ligne). Chaque lien passe par le même moteur que l’analyse et indique la méthode qui a fonctionné.</p>
<textarea id="urls" aria-label="Liens, un par ligne" placeholder="https://www.amazon.fr/…&#10;https://www.fnac.com/…"></textarea>
<p><button id="run" type="button">Lancer le diagnostic</button></p>
<div class="sum" id="sum" role="status" hidden></div>
<div id="out"></div>

<script src="phone-analyzer/normalizer.js"></script>
<script src="phone-analyzer/identify.js"></script>
<script src="phone-analyzer/crosscheck.js"></script>
<script src="phone-analyzer/fetcher.js"></script>
<script src="sources/catalogue.js"></script>
<script>
(function(){
  var btn = document.getElementById("run"), area = document.getElementById("urls"), out = document.getElementById("out"), sum = document.getElementById("sum");
  function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]; }); }
  var REASONS = { challenge:"vérification anti-robot", http:"refus du site (HTTP)", js:"page vide sans JavaScript", notfound:"page introuvable", unreadable:"aucun nom lisible", network:"réseau" };
  var catalogue = null;
  function loadCatalogue(){ if (catalogue) return Promise.resolve(catalogue); return window.GuideCatalogueSource.load().then(function(d){ catalogue = d.produits || []; return catalogue; }).catch(function(){ return []; }); }

  btn.addEventListener("click", function(){
    var urls = area.value.split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean).slice(0, 20);
    if (!urls.length) return;
    btn.disabled = true; out.innerHTML = ""; sum.hidden = false; sum.textContent = "En cours…";
    var stats = { read: 0, identified: 0, blocked: 0, total: urls.length }, done = 0;
    loadCatalogue().then(function(cat){
      return urls.reduce(function(chain, raw){
        return chain.then(function(){
          var url = /^https?:\/\//i.test(raw) ? raw : "https://" + raw, t0 = Date.now();
          var row = document.createElement("div"); row.className = "row"; row.innerHTML = "<b>" + esc(url) + "</b><span class=\"muted\">…</span>"; out.appendChild(row);
          return window.PhoneAnalyzerFetcher.resolveProduct(url).catch(function(){ return { ok:false, reason:"network", clues:{} }; }).then(function(d){
            var k = d.clues || {}, name = (d.product && d.product.name) || k.name || k.urlHint || "";
            var read = d.ok && d.kind === "product";
            var id = "—";
            if (name || k.ean || k.asin) {
              var r = window.PhoneAnalyzerCrosscheck.search(cat, { hints: [k.name, k.title, k.urlHint].concat(k.searchTitles || []), ean: k.ean, asin: k.asin });
              id = r.status === "identified" ? "identifié" : (r.status === "to_confirm" ? "à confirmer" : "hors catalogue");
              if (r.status === "identified") stats.identified++;
            }
            if (read) stats.read++; else if (d.blocked) stats.blocked++;
            var method = d.strategy || (d.ok ? "—" : (REASONS[d.reason] || "échec"));
            var cls = read ? "ok" : (d.ok ? "warn" : "ko");
            var trace = (d.trace || []).map(function(s){ return s.step + (s.outcome ? ":" + s.outcome : ""); }).join(" › ");
            row.innerHTML = "<b>" + esc(url) + "</b><span class=\"" + cls + "\">" + (read ? "lu" : (d.ok ? "page générale" : "non lu")) + "</span> · méthode : " + esc(method) + " · modèle : " + esc(id) +
              "<br>" + esc(name || "(aucun nom)") + "<br><span class=\"muted\">" + esc(trace) + " · " + Math.round((Date.now() - t0) / 100) / 10 + " s" + (d.needsCapture ? " · capture navigateur conseillée" : "") + "</span>";
            done++; sum.textContent = "Lus : " + stats.read + "/" + stats.total + " · Identifiés : " + stats.identified + "/" + stats.total + " · Bloqués : " + stats.blocked + (done < stats.total ? " (en cours " + done + "/" + stats.total + ")" : "");
          });
        });
      }, Promise.resolve());
    }).then(function(){ btn.disabled = false; });
  });
})();
</script>
</body>
</html>
